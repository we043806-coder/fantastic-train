<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <div class="input-section">
            <div class="input-group">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Add a new task..."
                    class="todo-input"
                    autocomplete="off"
                >
                <button id="addBtn" class="add-btn">Add Task</button>
            </div>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <ul id="todoList" class="todo-list">
            <!-- Tasks will be dynamically added here -->
        </ul>

        <div class="stats-section">
            <div class="stat">
                <span class="stat-label">Total:</span>
                <span id="totalTasks" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Active:</span>
                <span id="activeTasks" class="stat-value">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Completed:</span>
                <span id="completedTasks" class="stat-value">0</span>
            </div>
        </div>

        <button id="clearBtn" class="clear-btn">Clear Completed Tasks</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
